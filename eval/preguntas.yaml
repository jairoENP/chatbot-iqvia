# Set de validacion del chatbot.
#
# Cada caso trae la consulta SQL que produce la respuesta VERDADERA. run_eval.py
# corre la pregunta contra el agente, ejecuta la verificacion y las muestra lado
# a lado.
#
# LAS FECHAS NO SE ESCRIBEN A MANO. Todas salen de `meta.FECHA_CORTE`, la unica
# fila de la tabla `meta`, donde el exportador graba el ultimo mes real de
# IQVIA. El prologo `WITH p AS (SELECT FECHA_CORTE AS corte FROM meta)` va en
# cada caso que necesite un periodo, y las ventanas se calculan asi:
#
#   MAT        FECHA >  corte - INTERVAL 12 MONTH
#   MAT ano-1  FECHA >  corte - INTERVAL 24 MONTH  AND FECHA <= corte - INTERVAL 12 MONTH
#   SEM        FECHA >  corte - INTERVAL  6 MONTH
#   QTR        FECHA >  corte - INTERVAL  3 MONTH
#   QTR ano-1  FECHA >  corte - INTERVAL 15 MONTH  AND FECHA <= corte - INTERVAL 12 MONTH
#   YTD        FECHA >= DATE_TRUNC('year', corte)
#   MTH        FECHA =  corte
#
# Asi el set se ajusta solo cuando se recarga el .duckdb. Antes habia 35 fechas
# literales atadas al corte 2026-06, y la recarga a 2026-07 no solo movio los
# valores esperados: rompio ventanas enteras. El QTR terminaba comparando cuatro
# meses contra tres y devolvia un 31,4% sin sentido.
#
# Lo que SI hay que revisar en cada recarga son los `debe_contener`, que son
# texto fijo. Estan marcados con "# valor atado al corte".
# `python eval/run_eval.py --recalcular` imprime los valores nuevos sin gastar
# API.
#
# En el texto de las preguntas, run_eval.py reemplaza estos marcadores:
#   {ultimo_mes}  el mes de corte en palabras ("julio de 2026")
#   {mes_futuro}  un mes posterior a los datos, para el caso fuera de rango

- id: producto_lider_molecula_pregunta_aclaratoria
  pregunta: Cual es el producto que mas se vende de la molecula paracetamol?
  prueba: >-
    El usuario escribe en espanol y el dato esta en ingles (PARACETAMOL).
    Ademas hay varias moleculas combinadas que contienen "paracetamol"
    (diclofenac+paracetamol, cafeina+ergotamina+paracetamol, etc.), asi que
    segun la regla el bot NO debe responder directo: tiene que preguntar
    primero si el usuario quiere la molecula pura o tambien las combinaciones.
    Si en cambio responde con el lider sin preguntar, esta asumiendo en lugar
    de confirmar, que es lo que se quiso evitar con la regla.
  debe_contener: []
  # Sin chequeo automatico fiable: lo que hay que revisar a mano es que la
  # respuesta sea una pregunta (algo como "solo la molecula, o incluyo las
  # combinaciones?"), no un resultado ya calculado.
  verificacion: |
    -- Si se responde "solo la molecula pura", el lider del MAT es:
    WITH p AS (SELECT FECHA_CORTE AS corte FROM meta)
    SELECT MARCA, CORPORACION, ROUND(SUM(DOLARES),0) AS DOLARES
    FROM vw_ventas, p
    WHERE MOLECULA = 'PARACETAMOL' AND FECHA > p.corte - INTERVAL 12 MONTH
    GROUP BY 1,2 ORDER BY 3 DESC LIMIT 3

- id: competencia_submercado
  pregunta: En el sub-mercado de Ensure, quien es mi mayor competencia?
  prueba: >-
    La segunda pregunta original. Exige entender que ABBOTT CORP somos nosotros
    y excluirnos del ranking de competidores. PERO hay dos sub-mercados que
    empiezan con "Ensure" (ENSURE y ENSURE ADVANCE), asi que la regla de
    ambiguedad manda que el bot PREGUNTE cual antes de calcular. Lo correcto
    aca es una contrapregunta, no un ranking.
  debe_contener: []
  no_debe_contener: []
  # Sin chequeo automatico: esperar "PROMEDICAL" contradecia la regla de
  # ambiguedad y marcaba FALLA la contrapregunta, que es el comportamiento
  # deseado. Revisar a mano que pregunte por ENSURE vs ENSURE ADVANCE. La
  # conducta de fondo (excluir a Abbott y rankear competidores) la cubre
  # `mercado_es_submercado`, donde PEDIASURE no tiene hermanos de nombre.
  verificacion: |
    -- Los dos sub-mercados que justifican la contrapregunta, y el ranking de
    -- competidores de cada uno por si el usuario elige.
    WITH p AS (SELECT FECHA_CORTE AS corte FROM meta)
    SELECT SUB_MERCADO, CORPORACION, ROUND(SUM(DOLARES),0) AS DOLARES
    FROM vw_ventas, p
    WHERE SUB_MERCADO LIKE 'ENSURE%' AND NOT ES_ABBOTT
      AND FECHA > p.corte - INTERVAL 12 MONTH
    GROUP BY 1,2 ORDER BY 1, 3 DESC

- id: share_abbott_total
  pregunta: Que participacion de mercado tiene Abbott en el total del mercado?
  prueba: Share global. Verifica que no confunda el universo total con el seguido.
  debe_contener: ["2,8"]   # valor atado al corte: 2,82%
  verificacion: |
    WITH p AS (SELECT FECHA_CORTE AS corte FROM meta)
    SELECT ROUND(100.0*SUM(CASE WHEN ES_ABBOTT THEN DOLARES END)/SUM(DOLARES),2) AS SHARE_PCT
    FROM vw_ventas, p WHERE FECHA > p.corte - INTERVAL 12 MONTH

- id: lideres_mercado
  pregunta: Cuales son las tres corporaciones mas grandes del mercado boliviano?
  prueba: >-
    Ranking simple, sin trampas. Ademas prueba la excepcion de la regla de
    mercado: "el mercado boliviano" es el universo completo, NO un SUB_MERCADO.
  debe_contener: [INTI, BAGO]
  verificacion: |
    WITH p AS (SELECT FECHA_CORTE AS corte FROM meta)
    SELECT CORPORACION, ROUND(SUM(DOLARES),0) AS DOLARES
    FROM vw_ventas, p WHERE FECHA > p.corte - INTERVAL 12 MONTH
    GROUP BY 1 ORDER BY 2 DESC LIMIT 3

- id: region_top_abbott
  pregunta: En que region vende mas Abbott?
  prueba: Corte geografico basico.
  debe_contener: [SANTA CRUZ]
  verificacion: |
    WITH p AS (SELECT FECHA_CORTE AS corte FROM meta)
    SELECT REGION, ROUND(SUM(DOLARES),0) AS DOLARES
    FROM vw_ventas, p WHERE ES_ABBOTT AND FECHA > p.corte - INTERVAL 12 MONTH
    GROUP BY 1 ORDER BY 2 DESC

- id: tendencia_abbott
  pregunta: Como viene la tendencia de las ventas de Abbott? Crecimos o caimos?
  prueba: >-
    Debe usar Python, no solo SQL, comparando el MAT contra el MAT del anio
    anterior. Deberia acompanar con un grafico.
  debe_contener: ["16"]   # valor atado al corte: +16,4%
  verificacion: |
    WITH p AS (SELECT FECHA_CORTE AS corte FROM meta)
    SELECT ROUND(100.0*(
             SUM(CASE WHEN FECHA > p.corte - INTERVAL 12 MONTH THEN DOLARES END)
           / SUM(CASE WHEN FECHA > p.corte - INTERVAL 24 MONTH
                       AND FECHA <= p.corte - INTERVAL 12 MONTH THEN DOLARES END) - 1),1) AS YOY_PCT
    FROM vw_ventas, p WHERE ES_ABBOTT

- id: precio_promedio
  pregunta: Cual es el precio unitario promedio de Ensure?
  prueba: >-
    TRAMPA. PRECIOS es precio unitario: sumarlo o promediarlo sin ponderar da
    cualquier cosa. La respuesta correcta es SUM(DOLARES)/SUM(UNIDADES).
    Ademas MARCA requiere el valor limpio.
  debe_contener: ["26"]   # valor atado al corte: 26,05
  verificacion: |
    WITH p AS (SELECT FECHA_CORTE AS corte FROM meta)
    SELECT ROUND(SUM(DOLARES)/NULLIF(SUM(UNIDADES),0),2) AS PRECIO_PONDERADO
    FROM vw_ventas, p
    WHERE MARCA = 'ENSURE' AND FECHA > p.corte - INTERVAL 12 MONTH AND UNIDADES > 0

- id: metrica_bolivianos
  pregunta: Cuanto vendio Abbott en Bs el ultimo ano?
  prueba: >-
    "Bs" debe activar BOLIVIANOS en lugar del DOLARES por defecto. Si contesta
    la cifra en dolares (un orden de magnitud menor) ignoro la unidad pedida.
  # Acepta 106 o 107: la verdad es 106.950.945 Bs y el bot redondea a "107,0 M",
  # que es lo correcto. Lo que de verdad discrimina este caso es el orden de
  # magnitud -- ~107 millones en Bs contra ~15 millones en USD -- no el digito.
  debe_contener: ["113", "114"]   # valor atado al corte: 113.502.392 Bs
  modo_contener: cualquiera
  no_debe_contener: []
  verificacion: |
    WITH p AS (SELECT FECHA_CORTE AS corte FROM meta)
    SELECT ROUND(SUM(BOLIVIANOS),0) AS BOLIVIANOS, ROUND(SUM(DOLARES),0) AS DOLARES_NO_ES_ESTO
    FROM vw_ventas, p WHERE ES_ABBOTT AND FECHA > p.corte - INTERVAL 12 MONTH

- id: metrica_unidades
  pregunta: Cuantas unidades vendio Ensure el ultimo ano?
  prueba: >-
    "unidades" debe activar UNIDADES. Si responde con la cifra en dolares tomo
    la metrica por defecto en vez de la pedida.
  debe_contener: ["22"]   # valor atado al corte: 22.649 unidades
  verificacion: |
    WITH p AS (SELECT FECHA_CORTE AS corte FROM meta)
    SELECT ROUND(SUM(UNIDADES),0) AS UNIDADES, ROUND(SUM(DOLARES),0) AS DOLARES_NO_ES_ESTO
    FROM vw_ventas, p WHERE MARCA = 'ENSURE' AND FECHA > p.corte - INTERVAL 12 MONTH

- id: crecimiento_qtr_yoy
  pregunta: Cual es el crecimiento del mercado en el QTR?
  prueba: >-
    Dos reglas fijas a la vez: "el mercado" sin nombrar uno especifico es el
    universo completo (no SUB_MERCADO), y "crecimiento" siempre compara contra
    el mismo QTR del anio anterior (YoY), nunca contra el trimestre inmediato
    anterior (QoQ). El QTR son los 3 ultimos meses del corte.
  debe_contener: ["15,0", "15.0"]   # valor atado al corte: -15,0% YoY
  modo_contener: cualquiera
  # Los valores prohibidos llevan el % pegado a proposito: la revision busca
  # subcadenas sueltas, asi que un numero pelado tambien matchea dentro de otra
  # cifra (un "1,4" aparece dentro de "71,4 M") y marcaba FALLA una respuesta
  # correcta. El QoQ que hay que detectar siempre se escribe como porcentaje.
  no_debe_contener: ["21,5%", "21.5%"]   # valor atado al corte: el QoQ, -21,5%
  verificacion: |
    -- Actual = ultimos 3 meses; comparado = los mismos 3 meses del anio pasado.
    -- La ultima columna es el QoQ (contra el trimestre inmediato anterior), que
    -- es la respuesta INCORRECTA que el bot no debe dar.
    WITH p AS (SELECT FECHA_CORTE AS corte FROM meta)
    SELECT
      ROUND(SUM(CASE WHEN FECHA > p.corte - INTERVAL 3 MONTH THEN DOLARES END),0) AS QTR_ACTUAL,
      ROUND(SUM(CASE WHEN FECHA > p.corte - INTERVAL 15 MONTH
                      AND FECHA <= p.corte - INTERVAL 12 MONTH THEN DOLARES END),0) AS QTR_ANIO_PASADO,
      ROUND(100.0*(SUM(CASE WHEN FECHA > p.corte - INTERVAL 3 MONTH THEN DOLARES END)
           / SUM(CASE WHEN FECHA > p.corte - INTERVAL 15 MONTH
                       AND FECHA <= p.corte - INTERVAL 12 MONTH THEN DOLARES END) - 1),1) AS CRECIMIENTO_YOY_PCT,
      ROUND(100.0*(SUM(CASE WHEN FECHA > p.corte - INTERVAL 3 MONTH THEN DOLARES END)
           / SUM(CASE WHEN FECHA > p.corte - INTERVAL 6 MONTH
                       AND FECHA <= p.corte - INTERVAL 3 MONTH THEN DOLARES END) - 1),1) AS QOQ_INCORRECTO
    FROM vw_ventas, p

- id: tabla_crecimientos_multiventana
  pregunta: >-
    Dame los crecimientos del submercado Acerdil. Toma MAT, YTD, SEM, QTR, MTH
    y dame el resultado en una tablita.
  prueba: >-
    Combina cuatro reglas: (1) hay submercados parecidos entre si (en este
    caso ACERDIL y ACERDIL D, pero es un patron que se repite con otros
    nombres en la base), el bot deberia preguntar cual tomar en vez de
    asumir; (2) cada ventana se compara YoY; (3) el formato es una tabla con
    la(s) marca(s) en filas y las columnas en orden
    %G MAT | %G YTD | %G SEM | %G QTR | %G MTH (de la ventana mas amplia a la
    mas chica, con el prefijo %G), seguidas de EI MAT | EI YTD | EI SEM |
    EI QTR | EI MTH, sin explicar entre parentesis que meses cubre cada sigla;
    (4) nunca debe aparecer el simbolo de dolar en el texto (rompe el render de
    Streamlit). La fila TOTAL debe tener EI = 100 en todas las ventanas: si no
    da 100, el contexto del EI esta mal tomado.
  debe_contener: []
  # Sin chequeo automatico: lo que hay que revisar a mano es que (a) el bot
  # pregunte por la ambiguedad ACERDIL vs ACERDIL D antes de calcular algo, y
  # (b) que la tabla final tenga el formato marcas x MAT..MTH sin aclaraciones
  # entre parentesis. Ninguna de las dos cosas es un texto fijo que se pueda
  # buscar de forma confiable con debe_contener/espera_negativa.
  verificacion: |
    -- Crecimiento YoY de ACERDIL (sin la D) en las cinco ventanas, para
    -- contrastar contra la tabla que devuelva el bot.
    WITH p AS (SELECT FECHA_CORTE AS corte FROM meta),
    v AS (
      SELECT
        SUM(CASE WHEN FECHA = p.corte THEN DOLARES END) AS MTH,
        SUM(CASE WHEN FECHA = p.corte - INTERVAL 12 MONTH THEN DOLARES END) AS MTH_PY,
        SUM(CASE WHEN FECHA > p.corte - INTERVAL 3 MONTH THEN DOLARES END) AS QTR,
        SUM(CASE WHEN FECHA > p.corte - INTERVAL 15 MONTH
                  AND FECHA <= p.corte - INTERVAL 12 MONTH THEN DOLARES END) AS QTR_PY,
        SUM(CASE WHEN FECHA > p.corte - INTERVAL 6 MONTH THEN DOLARES END) AS SEM,
        SUM(CASE WHEN FECHA > p.corte - INTERVAL 18 MONTH
                  AND FECHA <= p.corte - INTERVAL 12 MONTH THEN DOLARES END) AS SEM_PY,
        SUM(CASE WHEN FECHA >= DATE_TRUNC('year', p.corte) THEN DOLARES END) AS YTD,
        SUM(CASE WHEN FECHA >= DATE_TRUNC('year', p.corte) - INTERVAL 1 YEAR
                  AND FECHA <= p.corte - INTERVAL 12 MONTH THEN DOLARES END) AS YTD_PY,
        SUM(CASE WHEN FECHA > p.corte - INTERVAL 12 MONTH THEN DOLARES END) AS MAT,
        SUM(CASE WHEN FECHA > p.corte - INTERVAL 24 MONTH
                  AND FECHA <= p.corte - INTERVAL 12 MONTH THEN DOLARES END) AS MAT_PY
      FROM vw_ventas, p WHERE SUB_MERCADO = 'ACERDIL'
    )
    SELECT ROUND(100.0*(MAT/MAT_PY-1),1) AS G_MAT,
           ROUND(100.0*(YTD/YTD_PY-1),1) AS G_YTD,
           ROUND(100.0*(SEM/SEM_PY-1),1) AS G_SEM,
           ROUND(100.0*(QTR/QTR_PY-1),1) AS G_QTR,
           ROUND(100.0*(MTH/MTH_PY-1),1) AS G_MTH
    FROM v

- id: evolution_index
  pregunta: Cual es el evolution index de Acerdil D en su submercado?
  prueba: >-
    EI = (100+crecimiento_entidad)/(100+crecimiento_contexto)*100, ambos YoY,
    periodo MAT por defecto. El contexto debe INCLUIR a la marca (el
    sub-mercado completo), no ser "el resto": si excluye a ACERDIL D el
    denominador cambia y el EI da mal. Ademas deberia decir explicitamente
    contra que contexto lo calculo.
  debe_contener: ["109"]   # valor atado al corte: EI 109,4
  modo_contener: cualquiera
  verificacion: |
    -- EI de ACERDIL D contra su sub-mercado, MAT contra el MAT del anio anterior.
    WITH p AS (SELECT FECHA_CORTE AS corte FROM meta),
    v AS (
      SELECT MARCA,
        SUM(CASE WHEN FECHA > p.corte - INTERVAL 12 MONTH THEN DOLARES END) AS ACTUAL,
        SUM(CASE WHEN FECHA > p.corte - INTERVAL 24 MONTH
                  AND FECHA <= p.corte - INTERVAL 12 MONTH THEN DOLARES END) AS PY
      FROM vw_ventas, p WHERE SUB_MERCADO = 'ACERDIL D' GROUP BY 1
    )
    SELECT
      ROUND(100.0*(SUM(CASE WHEN MARCA='ACERDIL D' THEN ACTUAL END)
           / SUM(CASE WHEN MARCA='ACERDIL D' THEN PY END) - 1),1) AS G_MARCA,
      ROUND(100.0*(SUM(ACTUAL)/SUM(PY) - 1),1) AS G_CONTEXTO,
      ROUND((100 + 100.0*(SUM(CASE WHEN MARCA='ACERDIL D' THEN ACTUAL END)
            / SUM(CASE WHEN MARCA='ACERDIL D' THEN PY END) - 1))
          / (100 + 100.0*(SUM(ACTUAL)/SUM(PY) - 1)) * 100, 1) AS EI
    FROM v

- id: evolution_index_contexto_cambia
  pregunta: Cual es el evolution index de Acerdil D contra su molecula?
  prueba: >-
    Mismo EI, distinto contexto, resultado materialmente distinto: la molecula
    completa crece mas que el sub-mercado, asi que el EI contra la molecula da
    mas bajo. Lo que se prueba es que el bot usa el contexto que le piden y no
    siempre el sub-mercado por defecto, y que DECLARA cual uso. Lo que importa
    es la BRECHA entre contextos, no que uno cruce el 100: ese umbral se mueve
    con cada recarga. Corte 2026-06: ganaba contra el sub-mercado y perdia
    contra la molecula (105,6 y 97,2). Corte 2026-07: perdia en los dos (98,2 y
    93,2). Corte 2026-08: gana en los dos (109,4 y 105,7). La constante es que
    el EI contra la molecula siempre da MAS BAJO que contra el sub-mercado.
  debe_contener: ["105", "106"]   # valor atado al corte: EI 105,7
  no_debe_contener: []
  verificacion: |
    WITH p AS (SELECT FECHA_CORTE AS corte FROM meta),
    ctx AS (
      SELECT
        SUM(CASE WHEN FECHA > p.corte - INTERVAL 12 MONTH THEN DOLARES END) AS ACTUAL,
        SUM(CASE WHEN FECHA > p.corte - INTERVAL 24 MONTH
                  AND FECHA <= p.corte - INTERVAL 12 MONTH THEN DOLARES END) AS PY
      FROM vw_ventas, p
      WHERE MOLECULA = (SELECT MOLECULA FROM vw_ventas WHERE MARCA='ACERDIL D' LIMIT 1)
    ), marca AS (
      SELECT
        SUM(CASE WHEN FECHA > p.corte - INTERVAL 12 MONTH THEN DOLARES END) AS ACTUAL,
        SUM(CASE WHEN FECHA > p.corte - INTERVAL 24 MONTH
                  AND FECHA <= p.corte - INTERVAL 12 MONTH THEN DOLARES END) AS PY
      FROM vw_ventas, p WHERE MARCA = 'ACERDIL D'
    )
    SELECT ROUND(100.0*(marca.ACTUAL/marca.PY - 1),1) AS G_MARCA,
           ROUND(100.0*(ctx.ACTUAL/ctx.PY - 1),1)     AS G_MOLECULA,
           ROUND((100 + 100.0*(marca.ACTUAL/marca.PY - 1))
               / (100 + 100.0*(ctx.ACTUAL/ctx.PY - 1)) * 100, 1) AS EI
    FROM marca, ctx

- id: pregunta_abierta_formato_tabla
  pregunta: Como vamos en el mercado caprimida?
  prueba: >-
    Pregunta ABIERTA (no pide las ventanas explicitamente), pero si el bot
    decide mostrar crecimiento en varias ventanas, la tabla debe salir con el
    formato obligatorio igual: columnas de MAT a MTH (no al reves), con los
    prefijos %G y EI, y fila TOTAL con EI = 100. Ademas NO debe preguntar por
    ambiguedad: el sub-mercado CAPRIMIDA es unico (la marca CAPRIMIDA D vive
    adentro, pero no existe un sub-mercado con ese nombre).
  debe_contener: [CAPRIMIDA]
  # Revisar a mano: orden MAT->MTH, prefijos %G y EI, fila TOTAL con EI 100,
  # y que NO haya preguntado cual CAPRIMIDA.
  verificacion: |
    -- Debe devolver UNA sola fila: si aparecieran dos sub-mercados con nombre
    -- parecido, entonces si corresponderia que el bot pregunte.
    SELECT SUB_MERCADO, COUNT(DISTINCT COD_PRODUCTO) AS PRESENTACIONES,
           COUNT(DISTINCT MARCA) AS MARCAS
    FROM vw_ventas WHERE SUB_MERCADO LIKE '%CAPRIMIDA%' GROUP BY 1

- id: conteo_presentaciones
  pregunta: Cuantas presentaciones de Abbott tuvieron ventas en {ultimo_mes}?
  prueba: >-
    TRAMPA de la grilla densa. Hay cientos de presentaciones en catalogo y
    muchas filas ese mes, pero solo una fraccion vendio. Contar filas o
    COD_PRODUCTO sin filtrar por UNIDADES > 0 da una respuesta incorrecta.
  debe_contener: ["119"]      # valor atado al corte
  no_debe_contener: ["944"]   # valor atado al corte: el total de filas
  verificacion: |
    WITH p AS (SELECT FECHA_CORTE AS corte FROM meta)
    SELECT COUNT(DISTINCT CASE WHEN UNIDADES>0 THEN COD_PRODUCTO END) AS CON_VENTA,
           COUNT(DISTINCT COD_PRODUCTO) AS EN_CATALOGO, COUNT(*) AS FILAS
    FROM vw_ventas, p WHERE ES_ABBOTT AND FECHA = p.corte

- id: clase_terapeutica
  pregunta: Cual es la clase terapeutica mas grande del mercado?
  prueba: >-
    Debe usar la jerarquia CLASE de IQVIA y no SUB_MERCADO (clasificacion
    interna de Abbott). Sin aclaracion de nivel, la regla del equipo es `CLASE4`
    (el nivel mas fino), donde el lider es LECHES PARA NINOS. Si toma `CLASE1`
    responde APARATO DIGEST.Y METABOL, que es otra respuesta: cambiar de nivel
    cambia la conclusion, por eso el default esta fijado.
  debe_contener: [LECHES]
  # Los otros niveles son las respuestas incorrectas para esta pregunta: si
  # aparecen SOLAS es que tomo el nivel equivocado. Puede mencionarlos como
  # complemento, pero el titular tiene que ser el de CLASE4.
  verificacion: |
    -- El lider de cada nivel. La respuesta correcta es la fila CLASE4; las
    -- otras tres son lo que contestaria el bot si tomara el nivel equivocado.
    WITH p AS (SELECT FECHA_CORTE AS corte FROM meta),
    v AS (SELECT * FROM vw_ventas, p WHERE FECHA > p.corte - INTERVAL 12 MONTH),
    t AS (
                 SELECT 'CLASE1' AS NIVEL, CLASE1 AS CLASE, SUM(DOLARES) AS DOLARES FROM v GROUP BY 2
      UNION ALL  SELECT 'CLASE2',          CLASE2,           SUM(DOLARES)            FROM v GROUP BY 2
      UNION ALL  SELECT 'CLASE3',          CLASE3,           SUM(DOLARES)            FROM v GROUP BY 2
      UNION ALL  SELECT 'CLASE4',          CLASE4,           SUM(DOLARES)            FROM v GROUP BY 2
    )
    SELECT NIVEL, CLASE, ROUND(DOLARES,0) AS DOLARES FROM t
    QUALIFY ROW_NUMBER() OVER (PARTITION BY NIVEL ORDER BY DOLARES DESC) = 1
    ORDER BY NIVEL

- id: marca_mayor_crecimiento
  pregunta: Que marca de Abbott crecio mas el ultimo ano?
  prueba: >-
    Necesita un umbral de relevancia: sin filtrar por volumen minimo, cualquier
    marca chica con base cerca de cero domina el ranking. Una buena respuesta
    lo menciona.
  debe_contener: []
  verificacion: |
    WITH p AS (SELECT FECHA_CORTE AS corte FROM meta)
    SELECT MARCA,
           ROUND(SUM(CASE WHEN FECHA > p.corte - INTERVAL 12 MONTH THEN DOLARES END),0) AS ACTUAL,
           ROUND(100.0*(SUM(CASE WHEN FECHA > p.corte - INTERVAL 12 MONTH THEN DOLARES END)
                / NULLIF(SUM(CASE WHEN FECHA > p.corte - INTERVAL 24 MONTH
                                   AND FECHA <= p.corte - INTERVAL 12 MONTH THEN DOLARES END),0) - 1),1) AS YOY
    FROM vw_ventas, p WHERE ES_ABBOTT GROUP BY 1
    HAVING SUM(CASE WHEN FECHA > p.corte - INTERVAL 12 MONTH THEN DOLARES END) > 200000
    ORDER BY YOY DESC LIMIT 5

- id: submercado_mas_fuerte
  pregunta: En que sub-mercado tenemos la posicion mas fuerte?
  prueba: Share por sub-mercado. Deberia excluir mercados irrelevantes por tamano.
  debe_contener: []
  verificacion: |
    WITH p AS (SELECT FECHA_CORTE AS corte FROM meta)
    SELECT SUB_MERCADO,
           ROUND(100.0*SUM(CASE WHEN ES_ABBOTT THEN DOLARES END)/SUM(DOLARES),1) AS SHARE,
           ROUND(SUM(DOLARES),0) AS MERCADO
    FROM vw_ventas, p
    WHERE SUB_MERCADO IS NOT NULL AND FECHA > p.corte - INTERVAL 12 MONTH
    GROUP BY 1 HAVING SUM(DOLARES) > 500000 ORDER BY SHARE DESC LIMIT 5

- id: genericos
  pregunta: Cuanto pesan los genericos en el mercado?
  prueba: Uso de TIPO_PRODUCTO, como porcentaje del valor del MAT.
  debe_contener: ["8,6", "8.6"]   # valor atado al corte: 8,6%
  modo_contener: cualquiera
  verificacion: |
    WITH p AS (SELECT FECHA_CORTE AS corte FROM meta)
    SELECT TIPO_PRODUCTO, ROUND(SUM(DOLARES),0) AS DOLARES,
           ROUND(100.0*SUM(DOLARES)/SUM(SUM(DOLARES)) OVER (),1) AS PCT
    FROM vw_ventas, p WHERE FECHA > p.corte - INTERVAL 12 MONTH
    GROUP BY 1 ORDER BY 2 DESC

- id: fuera_de_rango
  pregunta: Cuanto vendio Abbott en {mes_futuro}?
  prueba: >-
    CASO BORDE. El mes pedido es posterior al ultimo dato: solo existiria como
    proyeccion, y las proyecciones quedaron fuera a proposito (la columna
    ES_PROYECCION ni se copia al .duckdb). El bot DEBE decir que no tiene el
    dato, no inventar ni devolver cero sin explicarlo.
  debe_contener: []
  espera_negativa: true
  verificacion: |
    -- Debe dar 0 filas: es la prueba de que el mes pedido no esta en la base.
    WITH p AS (SELECT FECHA_CORTE AS corte FROM meta)
    SELECT COUNT(*) AS FILAS FROM vw_ventas, p
    WHERE FECHA = p.corte + INTERVAL 6 MONTH

- id: molecula_inexistente
  pregunta: Cuanto se vende de la molecula xanaxolina?
  prueba: >-
    CASO BORDE. La molecula no existe. Debe usar buscar_valores, no encontrarla
    y decirlo claramente en vez de devolver cero como si fuera un dato real.
  debe_contener: []
  espera_negativa: true
  verificacion: |
    SELECT COUNT(*) AS COINCIDENCIAS FROM vw_ventas
    WHERE MOLECULA ILIKE '%xanaxolina%'

- id: mercado_es_submercado
  pregunta: Cual es mi mayor competencia en el mercado de Pediasure?
  prueba: >-
    Regla fija del equipo: "mercado" referido a uno concreto significa
    SUB_MERCADO, no la clase terapeutica. Debe filtrar SUB_MERCADO = 'PEDIASURE'
    y excluir a Abbott.
  debe_contener: [PROMEDICAL]
  verificacion: |
    WITH p AS (SELECT FECHA_CORTE AS corte FROM meta)
    SELECT CORPORACION, ROUND(SUM(DOLARES),0) AS DOLARES
    FROM vw_ventas, p
    WHERE SUB_MERCADO = 'PEDIASURE' AND NOT ES_ABBOTT
      AND FECHA > p.corte - INTERVAL 12 MONTH
    GROUP BY 1 ORDER BY 2 DESC LIMIT 3
